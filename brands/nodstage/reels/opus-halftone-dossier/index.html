  // ---------------- S7 the whole file, pinned (21.95 – 25.0) ----------------
  scene(21.95, 25.0, (g) => {

      card(cs, 400, 200, { fill: i === 3 ? C.yellow : C.cream });
      txt(c, n, { x: 28, y: 150, 'font-size': 130, 'font-family': F.bagel, fill: C.navy, opacity: .9 });

    const st = stampEl(camG, 'CASE CLOSED', { size: 110 });

    return (t) => {

  // ---------------- S8 end card (25.0 – 28.6) ----------------
  scene(25.0, 28.6, (g) => {
    bg(g, C.mag);

    const l1 = chars(g, 'Run your studio', { x: 540, y: 560, size: 92, family: F.slab, fill: C.cream, anchor: 'middle', shadow: { fill: C.navy, dx: 7, dy: 7 } });

    const lg = el('g', {}, g); const lgi = el('g', {}, lg);

      const p = pop(t, 25.8, .45); op(lg, p > 0 ? 1 : 0); tf(lg, 540, 870, p, -2 * (1 - p));

  });

  // ---------------- HUD ----------------
  const hg = el('g', {}, hud);
  const caseT = txt(hg, 'CASE NS-0412 · FERNHILL COFFEE CO.', { x: 62, y: 262, 'font-size': 24, 'font-family': F.mono, 'font-weight': 800, fill: C.navy, 'letter-spacing': 1 });
  const chips = [[2.5, 'EXHIBIT 01', 'BOOKING'], [5.05, 'EXHIBIT 02', 'PROPOSAL'], [7.65, 'EXHIBIT 03', 'FEEDBACK'], [11.8, 'EXHIBIT 04', 'THE EXTRA'], [16.75, 'EXHIBIT 05', 'INVOICE'], [19.65, 'EXHIBIT 06', 'TESTIMONIAL'], [21.95, 'SUMMARY', 'ALL EXHIBITS']];

  for (let y = 0; y <= H + 80; y += 80) for (let x = 0; x <= W + 80; x += 80) wipeDots.push({ el: el('circle', { cx: x, cy: y, r: 0 }, dotsG), x, y });
  const WIPES = [[2.5, C.yellow], [5.05, C.mag], [7.65, C.blue], [11.8, C.night], [16.75, C.yellow], [19.65, C.mag], [21.95, C.blue], [25.0, C.mag]];
  wipeUpdate = (t) => {
    const w = WIPES.find(([b]) => Math.abs(t - b) < 0.22); show(dotsG, !!w); if (!w) return;
    dotsG.setAttribute('fill', w[1]); const u = (t - w[0] + 0.22) / 0.44;
    wipeDots.forEach(d => { const delay = (d.x / W * 0.4 + d.y / H * 0.6) * 0.35; const p = clamp((u - delay) / 0.65); d.el.setAttribute('r', (Math.sin(p * Math.PI) * 62).toFixed(1)); });
  };
}
let hudUpdate = () => {}, wipeUpdate = () => {};

function buildPaper() {
  const cv = document.getElementById('paper'), ctx = cv.getContext('2d'), r = rng(3);
  const small = document.createElement('canvas'); small.width = 54; small.height = 96;
  const sctx = small.getContext('2d'), sim = sctx.createImageData(54, 96);
  for (let i = 0; i < sim.data.length; i += 4) { const v = 242 + r() * 13; sim.data[i] = sim.data[i + 1] = sim.data[i + 2] = v; sim.data[i + 3] = 255; }
  sctx.putImageData(sim, 0, 0); ctx.imageSmoothingEnabled = true; ctx.drawImage(small, 0, 0, W, H);
  const base = ctx.getImageData(0, 0, W, H);
  for (let i = 0; i < base.data.length; i += 4) { const n = (r() - 0.5) * 26; base.data[i] = clamp(base.data[i] + n, 0, 255); base.data[i + 1] = clamp(base.data[i + 1] + n, 0, 255); base.data[i + 2] = clamp(base.data[i + 2] + n - 4, 0, 255); }
  ctx.putImageData(base, 0, 0);
  const gr = ctx.createRadialGradient(540, 960, 500, 540, 960, 1250); gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(1, 'rgba(120,100,80,0.35)');
  ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(140,120,100,0.18)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, 960); ctx.lineTo(W, 962); ctx.stroke();
}
function drawFx(frame) {
  const cv = document.getElementById('fx'), ctx = cv.getContext('2d'); ctx.clearRect(0, 0, W, H);
  const r = rng(1000 + Math.floor(frame / 2));
  ctx.fillStyle = 'rgba(255,248,235,0.75)'; for (let i = 0; i < 520; i++) { ctx.beginPath(); ctx.arc(r() * W, r() * H, 0.6 + r() * 1.8, 0, 7); ctx.fill(); }
  ctx.fillStyle = 'rgba(29,35,64,0.25)'; for (let i = 0; i < 90; i++) { ctx.beginPath(); ctx.arc(r() * W, r() * H, 0.6 + r() * 1.3, 0, 7); ctx.fill(); }
}

// stamps shake the camera; the approval also flashes
const STAMPS = [4.42, 7.0, 13.45, 15.85, 18.92, 21.12, 24.15];
const SHAKES = [[4.42, 12, .3], [7.0, 12, .3], [13.45, 10, .28], [15.85, 26, .45], [18.92, 18, .35], [21.12, 10, .28], [24.15, 16, .35]];
const boilT = document.getElementById('boilT');
function render(t) {
  const frame = Math.round(t * FPS);
  boilT.setAttribute('seed', 1 + (Math.floor(t * 10) % 40));
  for (const s of scenes) { const on = t >= s.t0 && t < s.t1; show(s.g, on); if (on) s.update(t); }
  let dx = 0, dy = 0;
  for (const [t0, a, d] of SHAKES) if (t >= t0 && t < t0 + d) { const k = 1 - (t - t0) / d; dx += a * k * k * Math.sin(t * 91 + t0); dy += a * k * k * Math.cos(t * 77 + t0 * 3); }
  const groove = (t < 11.8) || (t >= 16.75 && t < 25);
  const pulse = groove ? 1 + 0.006 * Math.exp(-((t % 0.5) / 0.07)) : 1;
  cam.setAttribute('transform', `translate(${(dx + 540 * (1 - pulse)).toFixed(2)} ${(dy + 960 * (1 - pulse)).toFixed(2)}) scale(${pulse.toFixed(4)})`);
  let fl = 0; if (t >= 15.85 && t < 16.0) fl = 0.5 * (1 - (t - 15.85) / 0.15); if (t >= 7.85 && t < 8.1) fl = Math.max(fl, 0.4 * (1 - (t - 7.85) / 0.25));
  op(flash, fl);
  op(fade, seg(t, 28.15, 28.6) * 0.0);
  presenterRender(t); hudUpdate(t); wipeUpdate(t); drawFx(frame);
}
async function init() {
  const fams = ['400 50px "Alfa Slab One"', '400 50px "Bagel Fat One"', '800 50px "JetBrains Mono"', '500 50px "JetBrains Mono"', '400 50px "Archivo Black"', '700 50px "Caveat"'];
  const sample = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789$,.+-:·→—?!\'';
  await Promise.all(fams.map(f => document.fonts.load(f, sample))); await document.fonts.ready;

  const imgs = [...document.querySelectorAll('image')].map(im => new Promise(res => { const i = new Image(); i.onload = res; i.onerror = res; i.src = im.getAttribute('href'); }));
  await Promise.all(imgs);
  render(parseFloat(new URLSearchParams(location.search).get('t') || '0'));
  window.READY = true;
}
