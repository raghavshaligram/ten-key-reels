<!doctype html>
<html><head><meta charset="utf-8"><title>Nodstage · one client (mid-century)</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>html,body{margin:0;background:#000;overflow:hidden;width:1080px;height:1920px}canvas{position:absolute;left:0;top:0;display:block}</style>
</head><body><canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
import { textures } from './engine/toon.js';
import { render, setImages, DUR } from './film.js';
const cv = document.getElementById('c'), g = cv.getContext('2d');
await Promise.all(['700 80px Oleo','400 80px Oleo','80px Slab','400 40px Jost','500 40px Jost','600 40px Jost','700 40px Jost'].map(f => document.fonts.load(f)));
textures();
const load = s => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = s; });
setImages({ proof: await load('proof.png'), logo: await load('logo.png') });
window.DURATION = DUR;
window.seek = t => render(g, t);
window.ready = Promise.resolve(true);
window.READY = true;
seek(0);
</script></body></html>
