<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Inter;font-weight:600;src:url(../../node_modules/@fontsource/inter-tight/files/inter-tight-latin-600-normal.woff2)}
@font-face{font-family:Inter;font-weight:800;src:url(../../node_modules/@fontsource/inter-tight/files/inter-tight-latin-800-normal.woff2)}
@font-face{font-family:Serif;font-style:italic;src:url(../../node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-italic.woff2)}
@font-face{font-family:Mono;font-weight:600;src:url(../../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-600-normal.woff2)}
:root{--paper:#F3F0EA;--ink:#191714;--grey:#CDC6BB;--red:#E0342C;--green:#2F7A4F;--muted:#8D867B}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--paper);color:var(--ink);font-family:Inter,sans-serif}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:radial-gradient(1100px 900px at 50% 40%,#f8f6f1 0%,#f3f0ea 55%,#ece7df 100%)}
#grain{position:absolute;inset:0;opacity:.35;mix-blend-mode:multiply;pointer-events:none}
.el{position:absolute;left:0;top:0;transform-origin:50% 50%}
.lab{font:600 26px/1 Mono;letter-spacing:.04em;color:var(--muted);text-transform:lowercase}
.ctr{font:600 26px/1 Mono;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;text-align:right}
.ctr b{color:var(--red);font-weight:600}
#cap{left:90px;top:290px;width:900px;font:600 78px/1.1 Inter;letter-spacing:-.025em}
#cap span{display:inline-block;margin-right:.24em;transition:none}
#cap .acc{font-family:Serif;font-style:italic;font-weight:400;color:var(--red);font-size:1.12em;letter-spacing:-.01em}
.stk{background:#fff;border-radius:34px;padding:14px;box-shadow:0 34px 70px rgba(40,30,20,.16),0 8px 18px rgba(40,30,20,.10)}
.win{background:#16181a;border-radius:24px;overflow:hidden}
.bar{height:58px;display:flex;align-items:center;gap:12px;padding:0 22px;background:#202326;color:#9aa19c;font:600 24px Mono}
.bar i{width:16px;height:16px;border-radius:50%;background:#3b3f43;display:inline-block}
.bar .t{margin-left:14px}
canvas{display:block}
.badge{width:104px;height:104px;border-radius:24px;background:#111;color:#fff;font:800 66px/104px Inter;text-align:center;box-shadow:0 10px 24px rgba(0,0,0,.25);border:5px solid #fff}
.stamp{font:800 64px/1 Inter;letter-spacing:.06em;color:var(--red);border:8px solid var(--red);border-radius:18px;padding:14px 26px 12px;background:rgba(255,255,255,.88);text-transform:uppercase;white-space:nowrap}
.key{width:250px;height:230px;border-radius:40px;background:linear-gradient(#fff,#ece8e1);box-shadow:0 14px 0 #cfc8bd,0 30px 50px rgba(40,30,20,.2);font:800 92px/210px Inter;text-align:center;color:#2a2622}
.chip{font:600 64px/1 Inter;padding:34px 46px;border-radius:30px;background:#fff;box-shadow:0 24px 50px rgba(40,30,20,.14);white-space:nowrap}
svg.draw ellipse,svg.draw path{fill:none;stroke-linecap:round}
#wipe{position:absolute;inset:0;pointer-events:none}
</style></head><body>
<div id="stage">
  <svg id="grain" width="1080" height="1920"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .45  0 0 0 0 .4  0 0 0 .55 0"/></filter><rect width="1080" height="1920" filter="url(#n)"/></svg>

  <div class="el lab" id="lab" style="left:90px;top:236px"></div>
  <div class="el ctr" id="ctr" style="left:540px;top:236px;width:450px"></div>
  <div class="el" id="cap"></div>

  <!-- b0: the number -->
  <div class="el stk" id="p0" style="left:110px;top:650px;width:860px;padding:50px 40px 56px;text-align:center">
    <div class="lab" style="font-size:30px;color:var(--muted)">keystrokes / hour</div>
    <div id="n0" style="font:800 220px/1 Inter;letter-spacing:-.05em;margin-top:22px;font-variant-numeric:tabular-nums">0</div>
  </div>
  <svg class="el draw" id="c0" width="900" height="420" style="left:90px;top:690px"><ellipse cx="450" cy="215" rx="410" ry="150" stroke="#E0342C" stroke-width="11" pathLength="1" stroke-dasharray="1" transform="rotate(-4 450 215)"/></svg>
  <div class="el stamp" id="s0" style="left:560px;top:1010px">can you?</div>

  <!-- b1: the clock -->
  <div class="el stk" id="p1" style="left:100px;top:610px;width:880px"><div class="win"><div class="bar"><i></i><i></i><i></i><span class="t">10keytypingtest.com</span></div><canvas id="k1" width="852" height="520"></canvas></div></div>
  <svg class="el draw" id="c1" width="420" height="260" style="left:560px;top:650px"><ellipse cx="210" cy="130" rx="190" ry="100" stroke="#E0342C" stroke-width="11" pathLength="1" stroke-dasharray="1"/></svg>
  <!-- b2: typing, live -->
  <div class="el stk" id="p2" style="left:100px;top:630px;width:880px"><div class="win"><div class="bar"><i style="background:#E0342C"></i><span class="t">live · entry field</span></div><canvas id="k2" width="852" height="440"></canvas></div></div>

  <!-- b3: no shortcuts -->
  <div class="el" id="p3" style="left:120px;top:700px;width:840px;height:300px">
    <div class="key" style="position:absolute;left:0;top:20px;width:330px">Ctrl</div>
    <div style="position:absolute;left:350px;top:70px;font:800 110px Inter;color:#b4ab9e">+</div>
    <div class="key" style="position:absolute;left:470px;top:20px">V</div>
  </div>
  <div class="el stamp" id="s3" style="left:300px;top:980px">not allowed</div>
  <!-- b4: the keypad -->
  <div class="el stk" id="p4" style="left:220px;top:590px;width:640px"><div class="win"><canvas id="k4" width="612" height="640"></canvas></div></div>

  <!-- b5: accuracy -->
  <div class="el stk" id="p5" style="left:110px;top:650px;width:860px;padding:46px 54px 54px">
    <div class="lab" style="font-size:30px">accuracy · one real minute</div>
    <div id="n5" style="font:800 200px/1 Inter;letter-spacing:-.05em;margin-top:18px;color:var(--green)">0%</div>
    <div style="height:30px;border-radius:15px;background:#ece7df;margin-top:30px;overflow:hidden"><div id="bar5" style="height:100%;width:0;background:var(--green);border-radius:15px"></div></div>
  </div>
  <!-- b6: score vs accuracy -->
  <div class="el chip" id="p6a" style="left:150px;top:670px;color:#a39b8f">a higher score</div>
  <svg class="el draw" id="x6" width="620" height="120" style="left:130px;top:680px"><path d="M10 70 Q 300 40 600 58" stroke="#E0342C" stroke-width="12" pathLength="1" stroke-dasharray="1"/></svg>
  <div class="el chip" id="p6b" style="left:330px;top:930px;color:var(--green)">accuracy ✓</div>

  <!-- b7: the real result -->
  <div class="el stk" id="p7" style="left:70px;top:650px;width:940px"><div class="win"><canvas id="k7" width="912" height="470"></canvas></div></div>
  <svg class="el draw" id="c7" width="560" height="240" style="left:270px;top:710px"><ellipse cx="280" cy="120" rx="250" ry="88" stroke="#E0342C" stroke-width="11" pathLength="1" stroke-dasharray="1" transform="rotate(-3 280 120)"/></svg>
  <div class="el stamp" id="s7" style="left:520px;top:1060px"></div>

  <!-- b8: the site -->
  <div class="el stk" id="p8" style="left:90px;top:610px;width:900px"><div class="win" style="background:#fff">
    <div class="bar" style="background:#efebe4;color:#3a3631;height:76px;font-size:30px"><i style="background:#e0a39e"></i><i style="background:#e8cf8c"></i><i style="background:#9fcfa8"></i>
      <span class="t" style="flex:1;background:#fff;border-radius:16px;padding:10px 20px;margin-left:16px"><span id="url"></span><span id="caret" style="color:var(--red)">|</span></span></div>
    <canvas id="k8" width="872" height="470"></canvas></div></div>
  <div class="el stamp" id="s8" style="left:640px;top:1050px">free</div>

  <div class="el badge" id="badge" style="left:900px;top:510px">1</div>
  <svg class="el" id="tara" viewBox="0 0 1000 1000" width="1000" height="1000" style="left:40px;top:1100px"></svg>
  <canvas id="wipe" width="1080" height="1920"></canvas>
</div>
<script src="../../engine/lib.js"></script>
<script src="../../engine/character.js"></script>
<script>
const TL = __TIMELINE__, RUN = __RUN__; const S = TL.scenes, W = TL.words, END = TL.end, R = TL.result;
const book = frameBook(RUN); const res = new Image(); res.src = "assets/result.jpg";
const tara = Tara("tara");
const hit = R.net >= 10000;
// her poses, keyed to the voice
const POSES = [[0, "wave"], [W.can - .2, "present"], [S[1] + .1, "point"], [W.go + .6, "rest"], [S[2] + .2, "oops"], [W.numpad - .2, "thumbs"],
  [S[3] + .1, "think"], [W.score - .7, "present"], [S[4] + .05, hit ? "cheer" : "point"], [S[5] + .1, "point"], [W.free - .1, "wave"], [W.free + .7, "rest"]];
const CH = [["// 01 · the number", "target <b>10,000</b>"], ["// 02 · one minute", "time <b>60 sec</b>"], ["// 03 · just the keypad", "keys <b>0–9</b>"],
  ["// 04 · accuracy", `accuracy <b>${R.acc}%</b>`], ["// 05 · the result", `net <b>${R.net.toLocaleString("en-US")}</b>`], ["// 06 · your turn", "cost <b>$0</b>"]];
const IDS = ["p0","c0","s0","p1","c1","p2","p3","s3","p4","p5","p6a","x6","p6b","p7","c7","s7","p8","s8","badge"];
const draw = (id, t, t0, dur = .5) => { $(id).querySelectorAll("ellipse,path").forEach((p) => p.setAttribute("stroke-dashoffset", (1 - easeInOut((t - t0) / dur)).toFixed(3))); $(id).style.opacity = t >= t0 ? 1 : 0; $(id).style.transform = ""; };
const fl = (t, k = 0) => Math.sin(t * 1.7 + k) * 6;                    // gentle float
const W8 = (id, im, fx, fy, fw, fh, bg = "#16181a") => im && im.naturalWidth && drawCrop(id, im, fx, fy, fw, fh, bg);
document.getElementById("s7").textContent = hit ? "10,000+ ✓" : "your score";

// caption: the sentence shows in grey, each word turns dark as it is spoken; [words] in red serif
const PH = (() => { let k = 0; return TL.caps.map((c) => { const toks = []; let acc = false;
  for (const raw of c.text.split(/\s+/)) { let w = raw; const open = w.startsWith("["), close = w.endsWith("]") || /\][.,?!]?$/.test(w);
    if (open) acc = true; w = w.replace(/[\[\]]/g, ""); toks.push({ w, acc, t: TL.wt[k] ? TL.wt[k][1] : 0 }); k++; if (close) acc = false; }
  return { t: c.t, toks }; }); })();
let capKey = -1;
function caption2(t) {
  let i = 0; for (let k = 0; k < PH.length; k++) if (t >= PH[k].t - .05) i = k;
  const el = $("cap"), ph = PH[i];
  if (capKey !== i) { el.innerHTML = ph.toks.map((x) => `<span class="${x.acc ? "acc" : ""}">${x.w}</span>`).join(""); capKey = i; }
  [...el.children].forEach((sp, j) => { const x = ph.toks[j], a = easeOut((t - x.t) / .18);
    sp.style.color = t >= x.t - .02 ? (x.acc ? "var(--red)" : "var(--ink)") : "var(--grey)"; sp.style.transform = `translateY(${(1 - a) * 8}px)`; });
  el.style.opacity = t > END - .25 ? 0 : 1;
}
function chapter(t) { let i = 0; for (let k = 0; k < S.length; k++) if (t >= S[k] - .05) i = k;
  if ($("lab").dataset.i != i) { $("lab").textContent = CH[i][0]; $("ctr").innerHTML = CH[i][1]; $("lab").dataset.i = i; }
  const a = easeOut((t - S[i]) / .3); for (const id of ["lab", "ctr"]) { $(id).style.opacity = a; $(id).style.transform = `translateY(${(1 - a) * -10}px)`; } }
function badge(t, n, t0, x, y) { if (t < t0) return; $("badge").textContent = n; $("badge").style.left = x + "px"; $("badge").style.top = y + "px"; slam("badge", t, t0, { r: -8 }); }
function wipe(t, t0) {   // halftone dots sweep across and clear
  const c = $("wipe"), g = c.getContext("2d"); g.clearRect(0, 0, 1080, 1920); const p = (t - t0) / .75; if (p <= 0 || p >= 1) return;
  g.fillStyle = "#111"; for (let y = 0; y < 1920 + 40; y += 42) for (let x = (y / 42) % 2 ? 21 : 0; x < 1080 + 40; x += 42) {
    const ph = p * 2.2 - (x / 1080) * .5 - (y / 1920) * .7, v = Math.sin(clamp(ph) * Math.PI); if (v > .02) { g.beginPath(); g.arc(x, y, v * 31, 0, 6.29); g.fill(); } } }

window.render = function (t) {
  for (const id of IDS) hide(id);
  // b0: 10,000
  if (t < S[1] + .3) { pop("p0", t, .05, { r: -1.5, y: fl(t) }); count("n0", t, .15, 1.4, 10000);
    draw("c0", t, W.can - .1, .55); slam("s0", t, W.can + .45, { r: -9 });
    for (const id of ["p0", "c0", "s0"]) out(id, t, S[1] - .15); }
  // b1, b2: one minute
  if (inWin(t, S[1], W.go + .2)) { W8("k1", book.at(.4), .45, 0, .55, .45); pop("p1", t, S[1] + .2, { r: 1.5, y: fl(t, 1) }); draw("c1", t, S[1] + .7, .45); badge(t, 1, S[1] + .35, 905, 550);
    for (const id of ["p1", "c1", "badge"]) out(id, t, W.go - .15); }
  if (inWin(t, W.go - .1, S[2])) { W8("k2", book.at(1.6 + (t - W.go) * 1.1), .02, .16, .62, .42); pop("p2", t, W.go - .05, { r: -1, y: fl(t, 2) }); badge(t, 1, W.go - .05, 905, 570);
    for (const id of ["p2", "badge"]) out(id, t, S[2] - .2); }
  // b3, b4: just the keypad
  if (inWin(t, S[2] - .05, W.numpad - .1)) { pop("p3", t, S[2] + .05, { y: fl(t, 3) }); slam("s3", t, W.shortcuts + .1, { r: 6 }); badge(t, 2, S[2] + .2, 905, 610);
    for (const id of ["p3", "s3", "badge"]) out(id, t, W.numpad - .45); }
  if (inWin(t, W.numpad - .45, S[3])) { W8("k4", book.at(2 + (t - W.numpad)), .765, .13, .235, .575); pop("p4", t, W.numpad - .4, { r: 2, y: fl(t, 4) }); badge(t, 2, W.numpad - .3, 800, 540);
    for (const id of ["p4", "badge"]) out(id, t, S[3] - .2); }
  // b5, b6: accuracy
  if (inWin(t, S[3] - .05, W.score - .8)) { pop("p5", t, S[3] + .05, { r: -1, y: fl(t, 5) }); badge(t, 3, S[3] + .2, 905, 590);
    const v = t < W.accuracy ? 0 : R.acc * easeOut((t - W.accuracy) / 1); $("n5").textContent = (Number.isInteger(R.acc) ? Math.round(v) : v.toFixed(1)) + "%"; $("bar5").style.width = v + "%";
    for (const id of ["p5", "badge"]) out(id, t, W.score - 1.1); }
  if (inWin(t, W.score - 1.1, S[4])) { pop("p6a", t, W.score - 1.05, { r: -3, y: fl(t, 6) }); draw("x6", t, W.score - .1, .35); pop("p6b", t, W.score + .25, { r: 2, y: fl(t, 7) });
    for (const id of ["p6a", "x6", "p6b"]) out(id, t, S[4] - .2); }
  // b7: the result, real
  if (inWin(t, S[4] - .05, S[5])) { if (res.naturalWidth) W8("k7", res, 0, .03, 1, .36); pop("p7", t, S[4], { r: 1, y: fl(t, 8) }); draw("c7", t, S[4] + .35, .5); slam("s7", t, S[4] + .8, { r: -7 });
    for (const id of ["p7", "c7", "s7"]) out(id, t, S[5] - .15); }
  // b8: the site
  if (t >= S[5] - .05) { W8("k8", book.at(.2), 0, 0, .75, .62, "#fff"); pop("p8", t, S[5], { r: -1, y: fl(t, 9) });
    const u = "10keytypingtest.com", n = Math.round(clamp((t - W.at10 + .1) / .8) * u.length); $("url").textContent = u.slice(0, n);
    $("caret").style.opacity = Math.sin(t * 8) > 0 ? 1 : 0; slam("s8", t, W.free, { r: -8 }); }
  chapter(t); caption2(t); tara.render(t, POSES, TL.amp); wipe(t, S[1] - .45);
};
window.ready = Promise.all([...book.imgs, res].map((i) => i.decode().catch(() => {}))).then(() => document.fonts.ready);
</script></body></html>
